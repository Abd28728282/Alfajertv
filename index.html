<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر - ArtPlayer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artplayer-app {
            width: 100%;
            max-width: 900px;
            height: 500px;
            position: relative;
        }

        /* طبقة التفاعل لبدء التشغيل مع الصوت مباشرة */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .play-button {
            width: 70px;
            height: 70px;
            background: #007aff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.5);
            margin-bottom: 12px;
        }

        .play-button svg {
            width: 32px;
            height: 32px;
            fill: #fff;
            margin-right: -4px;
        }

        .play-text {
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="artplayer-app">
        <!-- غطاء البدء لتجاوز حظر المتصفحات للصوت -->
        <div id="start-overlay">
            <div class="play-button">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div class="play-text">انقر لبدء البث المباشر مع الصوت</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const overlay = document.getElementById('start-overlay');

        const art = new Artplayer({
            container: '.artplayer-app',
            url: 'https://e2.alfajertv.com/hls/ftv1_720p/index.m3u8?md5=3JEzP8umoJFE9TTIjm9jRA&expires=1789292055',
            type: 'm3u8',
            isLive: true,
            autoplay: false, // سنتحكم بالتشغيل يدوياً عند النقر لضمان الصوت
            muted: false,
            volume: 1,
            fullscreen: true,
            fullscreenWeb: true,
            customType: {
                m3u8: function (video, url) {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                    }
                },
            },
        });

        art.on('ready', () => {
            // محاولة التشغيل المباشر أولاً (في حال كان المتصفح يتيح الصوت تلقائياً)
            art.muted = false;
            art.volume = 1;

            const playPromise = art.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // إذا وافق المتصفح على التشغيل والصوت فوراً، نخفي غطاء البدء
                    overlay.classList.add('hidden');
                }).catch(() => {
                    // إذا رفض المتصفح، ننتظر ضغطة المستخدم على الغطاء لتشغيل الصوت والبث فوراً
                    art.pause();
                });
            }
        });

        // عند نسيان المتصفح للصلاحية أو حظره للصوت، الضغطة هنا تضمن تشغيل البث والصوت 100%
        overlay.addEventListener('click', () => {
            art.muted = false;
            art.volume = 1;
            art.play();
            overlay.classList.add('hidden');
        });
    </script>

</body>
</html>
