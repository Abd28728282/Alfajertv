<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .player-wrapper {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        /* تكبير الـ iframe قليلاً لدفع العناصر خارج الشاشة */
        .iframe-container {
            position: absolute;
            top: -60px;
            left: -2%;
            width: 104%;
            height: calc(100% + 120px);
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            pointer-events: none; /* تعطيل التفاعل لمنع ظهور التلميحات */
        }

        /* طبقات سوداء لإخفاء العناصر */
        .overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #000;
            z-index: 10;
            pointer-events: none;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #000;
            z-index: 10;
            pointer-events: none;
        }

        .overlay-corner {
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 70px;
            background: #000;
            z-index: 11;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <div class="iframe-container">
            <iframe
                src="https://www.youtube.com/embed/rm3dipTiXpA?autoplay=1&mute=1&rel=0&modestbranding=1&showinfo=0&controls=1&iv_load_policy=3&fs=0&disablekb=1&playsinline=1"
                title="Live"
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>
        </div>
        <!-- طبقات إخفاء -->
        <div class="overlay-top"></div>
        <div class="overlay-corner"></div>
        <div class="overlay-bottom"></div>
    </div>
</body>
</html>
